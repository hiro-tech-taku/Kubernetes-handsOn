apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sm-api-hpa
  namespace: sm-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sm-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30   # CPU使用率30%超でスケールアウト
