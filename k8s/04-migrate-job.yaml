apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: sm-api
  labels:
    app: db-migrate
spec:
  # 失敗時に最大3回リトライ
  backoffLimit: 3
  # 完了したJobを24時間後に自動削除
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      # 正常終了後は再起動しない
      restartPolicy: Never
      # PostgreSQL が Ready になるまで待つ initContainer
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres.sm-api.svc.cluster.local 5432; do
                echo "PostgreSQL待機中..."
                sleep 3
              done
              echo "PostgreSQL接続確認完了"
      containers:
        - name: migrate
          image: sm-api-migrate:latest
          imagePullPolicy: Never          # kind load したローカルイメージ
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
